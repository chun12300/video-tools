<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>影片小工具箱</title>
  <meta name="description" content="在瀏覽器裡剪輯合併影片、把影片轉成 GIF,檔案不會上傳到任何伺服器。">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
</head>
<body>
  <header class="site-header">
    <h1>🎬 影片小工具箱</h1>
    <p class="tagline">影片剪輯、合併、轉 GIF — 全部在你的瀏覽器完成,<strong>檔案不會離開你的電腦</strong>。</p>
    <p class="desktop-hint">💻 建議使用電腦操作</p>
  </header>

  <main>
    <section class="tool-menu" aria-label="工具選單">
      <a class="tool-card" href="merge.html">
        <div class="tool-icon" aria-hidden="true">🎞️</div>
        <h2>影片合併剪輯</h2>
        <p>選擇多支影片,個別剪出想要的片段,依順序合併輸出成一支 MP4</p>
        <span class="tool-go">開始使用 →</span>
      </a>
      <a class="tool-card" href="gif.html">
        <div class="tool-icon" aria-hidden="true">🖼️</div>
        <h2>影片轉 GIF</h2>
        <p>剪一段影片,選擇尺寸與幀率,轉成 GIF 動圖下載</p>
        <span class="tool-go">開始使用 →</span>
      </a>
    </section>

    <section class="steps" aria-label="使用說明">
      <div class="step">
        <div class="step-num">1</div>
        <h2>選影片</h2>
        <p>選擇或拖放 MP4、MOV、WebM 影片檔</p>
      </div>
      <div class="step-arrow" aria-hidden="true">→</div>
      <div class="step">
        <div class="step-num">2</div>
        <h2>設定</h2>
        <p>剪出想要的片段,調整順序或輸出選項</p>
      </div>
      <div class="step-arrow" aria-hidden="true">→</div>
      <div class="step">
        <div class="step-num">3</div>
        <h2>下載</h2>
        <p>按下轉換,完成後預覽並下載</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>🔒 隱私優先:所有轉換都透過 <a href="https://ffmpegwasm.netlify.app/" target="_blank" rel="noopener">ffmpeg.wasm</a> 在你的瀏覽器裡完成,影片不會上傳到任何伺服器。</p>
  </footer>
</body>
</html>
